<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banque Misr Research Assistant</title>
<style>
  :root {
    --bg:#f6f7f9; --panel:#fff; --ink:#16191d; --muted:#5b636e; --line:#e3e6ea;
    --accent:#5a3fd6; --ok:#1a7f4b; --warn:#8a6100; --warn-bg:#fdf6e3; --bad:#a32626;
    --nav:#e8eaf6; --body:#e6f4ea; --footer:#fdece8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --panel:#1c1f25; --ink:#e9ecf1; --muted:#9aa3b0; --line:#2b3038;
            --accent:#a595f5; --ok:#57c78c; --warn:#e0b352; --warn-bg:#2a2416; --bad:#f08a8a;
            --nav:#252a44; --body:#1d3327; --footer:#3a2422; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:860px; margin:0 auto; padding:28px 20px 80px; }
  h1 { font-size:19px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:22px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  form { display:flex; gap:8px; }
  input[type=text] { flex:1; padding:11px 13px; font-size:15px; color:var(--ink); text-align:start;
    background:var(--panel); border:1px solid var(--line); border-radius:8px; }
  input[type=text]:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  button { padding:11px 18px; font-size:15px; font-weight:600; color:#fff; background:var(--accent);
    border:0; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .interpreting { margin-top:12px; padding:10px 12px; background:var(--warn-bg);
    border-left:3px solid var(--warn); border-radius:0 6px 6px 0; font-size:13.5px; }
  .interpreting b { font-weight:600; }
  .hop { border-top:1px solid var(--line); padding:13px 0; }
  .hop:first-child { border-top:0; }
  .hopline { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .num { color:var(--muted); font-variant-numeric:tabular-nums; font-size:12.5px; min-width:38px; }
  .label { font-weight:600; }
  .badge { font-size:11px; text-transform:uppercase; letter-spacing:.04em; padding:2px 7px;
    border-radius:20px; color:var(--ink); }
  .badge.nav{background:var(--nav)} .badge.body{background:var(--body)} .badge.footer{background:var(--footer)}
  /* The reasoning is the point of the whole screen: it is what shows the agent
     deciding rather than a script running. */
  /* dir="auto" is per-string by definition: the browser picks direction from
     the first strong character, so one run can hold Arabic and English lines
     without flipping the page. URLs and badges stay explicitly ltr. */
  .why { margin-top:6px; padding-left:46px; color:var(--ink); font-size:14px; text-align:start; }
  [dir=auto] { text-align:start; }
  .meta, .badge, ul.sources { direction:ltr; text-align:left; }
  .meta { margin-top:4px; padding-left:46px; color:var(--muted); font-size:12.5px;
    font-variant-numeric:tabular-nums; word-break:break-all; }
  .verdict { padding:14px 16px; border-radius:10px; border:1px solid var(--line); }
  .verdict h2 { font-size:15px; margin:0 0 4px; }
  .verdict p { margin:0; font-size:14px; }
  .v-ok    { border-left:4px solid var(--ok); }
  .v-warn  { border-left:4px solid var(--warn); background:var(--warn-bg); }
  .v-none  { border-left:4px solid var(--muted); }
  .v-bad   { border-left:4px solid var(--bad); }
  .caveat { margin-top:6px; font-size:13px; color:var(--muted); }
  ul.sources { margin:8px 0 0; padding-left:20px; font-size:13.5px; word-break:break-all; }
  ul.sources a { color:var(--accent); }
  .timing { margin-top:10px; font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .spin { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--accent);
    animation:p 1s ease-in-out infinite; margin-right:7px; }
  @keyframes p { 0%,100%{opacity:.25} 50%{opacity:1} }
  .status { color:var(--muted); font-size:13px; }
  h3 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
       margin:0 0 10px; font-weight:600; }

  /* --- plan ------------------------------------------------------------ */
  .sg { display:flex; gap:9px; align-items:baseline; padding:6px 0; font-size:14px;
        border-top:1px solid var(--line); }
  .sg:first-child { border-top:0; }
  .sg .dot { width:15px; flex:none; text-align:center; font-size:12px; }
  .sg .q { flex:1; text-align:start; }
  .sg .why2 { color:var(--muted); font-size:12.5px; margin-top:2px; }
  .sg.pending .q  { color:var(--muted); }
  .sg.running .q  { font-weight:600; }
  .sg.resolved .dot { color:var(--ok); }
  .sg.partial  .dot { color:var(--warn); }
  .sg.not_available .dot, .sg.unresolved .dot { color:var(--muted); }
  .budget { margin-top:10px; font-size:12.5px; color:var(--muted);
            font-variant-numeric:tabular-nums; }
  .expanded { font-size:12.5px; color:var(--muted); padding:6px 0 0 24px; }

  /* --- hops grouped by sub-goal ---------------------------------------- */
  .sgroup { border-top:1px solid var(--line); padding-top:10px; margin-top:10px; }
  .sgroup:first-child { border-top:0; margin-top:0; padding-top:0; }
  .sgroup > .head { font-size:12.5px; color:var(--muted); margin-bottom:2px; text-align:start; }

  /* --- gate ------------------------------------------------------------- */
  .gate { margin:8px 0 0 46px; padding:8px 10px; font-size:12.5px;
          background:var(--warn-bg); border-left:3px solid var(--warn);
          border-radius:0 6px 6px 0; }

  /* --- answer ----------------------------------------------------------- */
  .answer { white-space:pre-wrap; font-size:14.5px; text-align:start; }
  .support { display:flex; align-items:center; gap:9px; margin-top:12px;
             font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .bar { flex:1; max-width:190px; height:6px; border-radius:4px; background:var(--line);
         overflow:hidden; direction:ltr; }
  .bar > i { display:block; height:100%; background:var(--ok); }
  .bar.warn > i { background:var(--warn); }
  .bar.bad  > i { background:var(--bad); }
  ul.gaps { margin:8px 0 0; padding-left:20px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Banque Misr Research Assistant</h1>
  <div class="sub">Navigates the live site from the homepage. Every step is the agent's own choice.</div>

  <div class="panel">
    <form id="form">
      <input id="task" type="text" autocomplete="off" dir="auto"
             placeholder="e.g. Find the annual fee of the classic credit card" required>
      <button id="go" type="submit">Run</button>
    </form>
    <div id="interpreting" class="interpreting" hidden></div>
    <div id="status" class="status" hidden></div>
  </div>

  <div class="panel" id="planPanel" hidden>
    <h3>Plan</h3>
    <div id="plan"></div>
    <div id="budget" class="budget"></div>
  </div>

  <div class="panel" id="hopsPanel" hidden>
    <h3>Navigation</h3>
    <div id="hops"></div>
  </div>

  <div id="final"></div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let sessionId = null, es = null, pollTimer = null;
// Hops are numbered per sub-goal now (each walks live from the seed), so the
// poll fallback's de-duplication has to be keyed by sub-goal too -- a single
// counter would swallow every sub-goal's hop 0 after the first.
let seenHops = {}, planState = { order: [], byId: {} }, currentSubGoal = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

// Every terminal status gets its own voice. "arrived" is deliberately not
// styled or worded as success: nothing has verified the page's content, and
// presenting it as an answer would be the single most misleading thing the UI
// could do.
const VERDICTS = {
  resolved:      { cls:"v-ok",   title:"Answered",
                   caveat:"A validator confirmed this page answers the request." },
  arrived:       { cls:"v-warn", title:"Reached what looks like the destination",
                   caveat:"Content not yet verified — the agent judged the route, not the page. No validator has checked that this page actually answers the request." },
  no_candidates: { cls:"v-none", title:"Couldn't find it",
                   caveat:"Nothing on the pages reached led toward this request. The site may not cover it." },
  exhausted:     { cls:"v-none", title:"Couldn't find it",
                   caveat:"The agent ran out of budget before reaching an answer." },
  blocked:       { cls:"v-bad",  title:"The site blocked the request",
                   caveat:"An access-denied page was returned. The run stopped rather than risk a ban." },
  error:         { cls:"v-bad",  title:"The run failed",  caveat:"" },
};

function setBusy(busy, note) {
  $("go").disabled = busy;
  $("status").hidden = !note;
  $("status").innerHTML = busy && note ? `<span class="spin"></span>${esc(note)}` : esc(note || "");
}

function reset() {
  $("hops").innerHTML = ""; $("hopsPanel").hidden = true;
  $("plan").innerHTML = ""; $("planPanel").hidden = true; $("budget").textContent = "";
  $("final").innerHTML = ""; $("interpreting").hidden = true;
  seenHops = {}; planState = { order: [], byId: {} }; currentSubGoal = null;
  gateShown.clear(); pendingGates = {};
  if (es) { es.close(); es = null; }
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

function showReplayBadge(d) {
  // A recording must never be passed off as a live run.
  if (!d.replayed) return;
  const note = document.createElement("div");
  note.className = "interpreting";
  note.innerHTML = "<b>Replay:</b> these events come from a saved run, not a live one.";
  $("final").before(note);
}

function showResolved(d) {
  showReplayBadge(d);
  // Keyed on the observable fact that the text changed, not only on the
  // model's used_context self-report: a model can rewrite a follow-up
  // correctly and still claim it used no context, and that would have hidden
  // the one piece of visible evidence that conversation memory works.
  const rewritten = d.sub_goal && d.sub_goal !== d.task;
  if (!rewritten && !d.used_context) return;
  $("interpreting").hidden = false;
  $("interpreting").innerHTML = rewritten
    ? `<b>Interpreting as:</b> <span dir="auto">${esc(d.sub_goal)}</span>` +
      `<div class="caveat" dir="auto">${esc(d.reasoning)}</div>`
    : `<b>Read in the context of this conversation.</b>` +
      `<div class="caveat" dir="auto">${esc(d.reasoning)}</div>`;
}

// --- plan -----------------------------------------------------------------
const SG_MARK = {
  pending:"·", running:"▸", resolved:"✓", partial:"~",
  not_available:"✕", unresolved:"✕", unreadable:"✕",
};
const SG_WORD = {
  pending:"queued", running:"navigating…", resolved:"answered",
  partial:"partly answered", not_available:"not found",
  unresolved:"not found", unreadable:"document unreadable",
};

function renderPlan() {
  if (!planState.order.length) return;
  $("planPanel").hidden = false;
  $("plan").innerHTML = planState.order.map((id) => {
    const sg = planState.byId[id];
    const state = sg.status || "pending";
    return `<div class="sg ${esc(state)}">` +
      `<span class="dot">${SG_MARK[state] || "·"}</span>` +
      `<span class="q"><span dir="auto">${esc(sg.question)}</span>` +
      `<div class="why2" dir="auto">${esc(sg.reason || SG_WORD[state] || "")}</div></span>` +
    `</div>`;
  }).join("");
}

function showPlan(d) {
  planState = { order: [], byId: {} };
  (d.sub_goals || []).forEach((sg) => {
    planState.order.push(sg.id);
    planState.byId[sg.id] = { question: sg.question, status: sg.status || "pending", reason: "" };
  });
  renderPlan();
  showBudget(d);
}

function showBudget(d) {
  if (d.pages_max === undefined || d.pages_max === null) return;
  $("budget").textContent =
    `budget · ${d.pages_used}/${d.pages_max} pages · ` +
    `${d.llm_calls_used}/${d.llm_calls_max} model calls`;
}

function subGoalStarted(d) {
  currentSubGoal = d.sub_goal_id;
  if (!planState.byId[d.sub_goal_id]) {
    planState.order.push(d.sub_goal_id);
    planState.byId[d.sub_goal_id] = { question: d.question, status: "pending", reason: "" };
  }
  planState.byId[d.sub_goal_id].status = "running";
  planState.byId[d.sub_goal_id].reason = "";
  renderPlan();
}

function subGoalFinished(d) {
  const sg = planState.byId[d.sub_goal_id] ||
    (planState.order.push(d.sub_goal_id), planState.byId[d.sub_goal_id] = { question: d.question });
  sg.question = d.question;
  sg.status = d.status;
  sg.reason = d.reason;
  renderPlan();
  showBudget(d);
}

function planExpanded(d) {
  (d.added || []).forEach((sg) => {
    if (planState.byId[sg.id]) return;
    planState.order.push(sg.id);
    planState.byId[sg.id] = { question: sg.question, status: "pending", reason: "added from what was found" };
  });
  renderPlan();
  const note = document.createElement("div");
  note.className = "expanded";
  note.textContent = `plan expanded: +${(d.added || []).length} sub-goal(s) from what the page listed`;
  $("hops").appendChild(note);
}

// --- gate -----------------------------------------------------------------
// Rendered rather than only logged: the validator said stop and the run kept
// going, which is a decision the screen has to own up to.
const gateShown = new Set();
let pendingGates = {};
function showGate(d) {
  if (d.accepted) return;
  const key = `${d.sub_goal_id}|${d.url}`;   // the poll fallback resends
  if (gateShown.has(key)) return;
  gateShown.add(key);
  $("hopsPanel").hidden = false;
  const el = document.createElement("div");
  el.className = "gate";
  el.innerHTML =
    `<b>Kept looking.</b> The validator accepted this page, but its evidence ` +
    `also appears on ${d.pages_compared} other page(s) fetched in this run, so it is ` +
    `site navigation rather than an answer.` +
    `<div class="caveat" dir="auto">validator said: ${esc(d.validator_reason)}</div>`;

  // Anchored to the hop it is about. The gate runs during validation, which
  // happens before the step is logged, so on a live stream the notice arrives
  // *before* the hop it belongs to and there is nothing to attach it to yet.
  // Held until addHop renders that page; appending to the end instead would
  // stack every notice under whichever hop rendered last, reading as though
  // one page had been rejected twice.
  const hop = $("hops").querySelector(`.hop[data-url="${CSS.escape(d.url)}"]`);
  if (hop) hop.insertAdjacentElement("afterend", el);
  else (pendingGates[d.url] ||= []).push(el);
}

function flushGates(url) {
  const waiting = pendingGates[url];
  if (!waiting) return;
  delete pendingGates[url];
  const hop = $("hops").querySelector(`.hop[data-url="${CSS.escape(url)}"]`);
  waiting.forEach((el) => (hop ? hop.insertAdjacentElement("afterend", el)
                               : $("hops").appendChild(el)));
}

// --- hops -----------------------------------------------------------------
function hopGroup(d) {
  const key = d.sub_goal_id || "_";
  const id = "sgroup-" + key;
  let group = document.getElementById(id);
  if (!group) {
    group = document.createElement("div");
    group.className = "sgroup";
    group.id = id;
    if (planState.order.length > 1) {
      group.innerHTML = `<div class="head" dir="auto">for: ${esc(d.sub_goal || "")}</div>`;
    }
    $("hops").appendChild(group);
  }
  return group;
}

function addHop(d) {
  const key = d.sub_goal_id || "_";
  if (d.hop < (seenHops[key] || 0)) return;   // poll fallback may resend
  seenHops[key] = d.hop + 1;
  $("hopsPanel").hidden = false;
  const badge = d.source ? `<span class="badge ${esc(d.source)}">${esc(d.source)}</span>` : "";
  const label = d.hop === 0 ? "Starting page" : esc(d.label || "(unlabelled link)");
  const el = document.createElement("div");
  el.className = "hop";
  el.dataset.url = d.url;                    // so a gate notice can find its page
  el.innerHTML =
    `<div class="hopline"><span class="num">hop ${d.hop}</span>` +
    `<span class="label" dir="auto">${label}</span>${badge}</div>` +
    `<div class="why" dir="auto">${esc(d.reasoning)}</div>` +
    `<div class="meta">${esc(d.url)} · ${d.status} · ${d.links_found} links` +
    (d.hop > 0 ? ` · ${d.candidates_offered}/${d.candidates_available} candidates` +
                 ` · confidence ${Number(d.confidence).toFixed(2)}` : "") + `</div>`;
  hopGroup(d).appendChild(el);
  flushGates(d.url);
}

// --- the answer -----------------------------------------------------------
function showAnswer(d) {
  const gaps = (d.not_found || []).map((g) => `<li dir="auto">${esc(g)}</li>`).join("");
  const sources = (d.source_urls || []).map(
    (u) => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></li>`).join("");

  // What the bar means depends on how the answer was produced, so the label
  // changes with it rather than implying one warranty for both.
  //
  // support_rate is 1.0 when nothing was claimed, which would read as "fully
  // supported". With no claims there is nothing to be supported, so the bar is
  // replaced by a plain statement rather than a reassuring green line.
  const composed = d.answer_source === "composed";
  const g = (d.composition && d.composition.grounding) || null;

  let support;
  if (!d.claims_total) {
    support = `<div class="support">No verifiable claims were extracted, ` +
              `so there is nothing to attribute.</div>`;
  } else {
    const pct = Math.round((d.support_rate || 0) * 100);
    const cls = pct === 100 ? "" : (pct >= 50 ? "warn" : "bad");
    support =
      `<div class="support">` +
      `<span>Facts whose value was found on the page they cite:</span>` +
      `<span class="bar ${cls}"><i style="width:${pct}%"></i></span>` +
      `<span>${d.claims_supported}/${d.claims_total} (${pct}%)</span></div>` +
      (pct < 100 ? `<div class="caveat">Unsupported statements were removed from the ` +
                   `answer above rather than shown with sources beneath them.</div>` : "");
  }

  // How the wording was produced. A template answer is assembled from the
  // extracted values and cannot say anything they do not; a composed one was
  // written by the model and had every sentence checked against those values.
  // Saying which is the difference between "verified" meaning two things.
  let provenance = "";
  if (composed && g) {
    provenance =
      `<div class="caveat"><b>Written by the model</b> from ${d.composition.claims_offered} ` +
      `verified facts. Every figure was checked against them` +
      (g.sentences_struck
        ? `; ${g.sentences_struck} of ${g.sentences_total} sentence(s) were removed for ` +
          `saying something the evidence does not: ` +
          esc(g.struck.map((s) => s.reason.replace(/\.$/, "")).join("; "))
        : ` and all ${g.sentences_total} sentence(s) passed`) + `.</div>`;
  } else if (d.composition && d.composition.attempted && !d.composition.used) {
    provenance = `<div class="caveat"><b>Showing the extracted values.</b> ` +
      `A written answer was attempted and discarded: ${esc(d.composition.reason)}.</div>`;
  } else if (d.claims_total) {
    provenance = `<div class="caveat"><b>Showing the extracted values</b> exactly as they ` +
      `appear on the page — no wording was generated.</div>`;
  }

  $("final").innerHTML =
    `<div class="panel verdict ${d.resolved_count ? "v-ok" : "v-none"}">` +
      `<h2>${d.resolved_count ? "Answer" : "No answer found"}</h2>` +
      `<div class="answer" dir="auto">${esc(d.answer || "")}</div>` +
      support + provenance +
      (d.budget_exhausted ? `<div class="caveat">Stopped early: ${esc(d.budget_exhausted)}. ` +
        `Sub-goals left unvisited are listed below.</div>` : "") +
      (d.gate_rejections ? `<div class="caveat">${d.gate_rejections} page(s) were accepted by the ` +
        `validator and rejected here as site navigation.</div>` : "") +
      `<div class="timing">${d.resolved_count}/${d.sub_goals_total} sub-goals answered</div>` +
    `</div>` +
    (gaps ? `<div class="panel"><h3>Not found</h3><ul class="gaps">${gaps}</ul></div>` : "") +
    (sources ? `<div class="panel"><h3>Sources cited</h3><ul class="sources">${sources}</ul></div>` : "");
  setBusy(false, "");
}

function showDone(d) {
  // The loop's answer is the result whenever there is one; the older
  // page-reached verdict is kept for a bare navigation with no plan behind it
  // (replayed recordings from before the intelligence layer landed, and the
  // navigator-only tests).
  if (d.answer) { showAnswer(d.answer); return; }
  const v = VERDICTS[d.status] || VERDICTS.error;
  const t = d.timing || {};
  const secs = (k) => Number(t[k] || 0).toFixed(1);
  const sources = (d.sources || []).map(
    (u) => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></li>`).join("");
  $("final").innerHTML =
    `<div class="panel verdict ${v.cls}">` +
      `<h2>${esc(v.title)}</h2>` +
      `<p dir="auto">${esc(d.final_reasoning || "")}</p>` +
      (v.caveat ? `<div class="caveat">${esc(v.caveat)}</div>` : "") +
      (d.page_url ? `<div class="caveat">Page reached: <a href="${esc(d.page_url)}" ` +
                    `target="_blank" rel="noopener">${esc(d.page_url)}</a></div>` : "") +
      `<div class="timing">${d.hops_used} hops · ${d.pages_fetched} pages · ` +
        `total ${secs("total_s")}s (model ${secs("llm_s")}s · ` +
        `requests ${secs("page_request_s")}s · pdf ${secs("pdf_text_s")}s · ` +
        `pacing ${secs("page_rate_limit_wait_s")}s)</div>` +
    `</div>` +
    (sources ? `<div class="panel"><h3>Sources visited</h3><ul class="sources">${sources}</ul></div>` : "");
  setBusy(false, "");
}

function showError(d) {
  const v = VERDICTS[d.kind === "blocked" ? "blocked" : "error"];
  $("final").innerHTML =
    `<div class="panel verdict ${v.cls}"><h2>${esc(v.title)}</h2>` +
    `<p>${esc(d.message)}</p></div>`;
  setBusy(false, "");
}

function finish() {
  if (es) { es.close(); es = null; }
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

// Poll fallback: used when EventSource never connects or drops mid-run. The
// status endpoint accumulates everything the stream emitted, so replaying it
// is safe -- addHop ignores hops already on screen.
function startPolling(taskId) {
  if (pollTimer) return;
  setBusy(true, "Live updates unavailable — polling for progress…");
  pollTimer = setInterval(async () => {
    let r;
    try { r = await fetch(`/api/tasks/${taskId}`); } catch { return; }
    if (r.status === 404) {
      finish();
      showError({ kind:"internal", message:"This run was lost — the server restarted." });
      return;
    }
    const s = await r.json();
    if (s.sub_goal) showResolved({ ...s, task: s.task });
    if (s.plan) showPlan(s.plan);
    if (s.answer) showAnswer(s.answer);
    (s.sub_goals || []).forEach(subGoalFinished);
    (s.gate_events || []).forEach(showGate);
    (s.hops || []).forEach(addHop);
    if (s.state === "done" && s.result) { finish(); showDone(s.result); }
    if (s.state === "error" && s.error) { finish(); showError(s.error); }
  }, 1000);
}

function stream(taskId) {
  let sawAny = false;
  es = new EventSource(`/api/tasks/${taskId}/stream`);
  es.addEventListener("resolved", (e) => { sawAny = true; showResolved(JSON.parse(e.data)); });
  es.addEventListener("hop",      (e) => { sawAny = true; addHop(JSON.parse(e.data)); });
  es.addEventListener("plan",             (e) => { sawAny = true; showPlan(JSON.parse(e.data)); });
  es.addEventListener("sub_goal_started", (e) => { sawAny = true; subGoalStarted(JSON.parse(e.data)); });
  es.addEventListener("sub_goal_finished",(e) => { sawAny = true; subGoalFinished(JSON.parse(e.data)); });
  es.addEventListener("plan_expanded",    (e) => { sawAny = true; planExpanded(JSON.parse(e.data)); });
  es.addEventListener("gate",             (e) => { sawAny = true; showGate(JSON.parse(e.data)); });
  es.addEventListener("budget",           (e) => { showBudget(JSON.parse(e.data)); });
  es.addEventListener("synthesis_started",(e) => {
    setBusy(true, "Checking every claim against the pages this run actually fetched…");
  });
  es.addEventListener("answer",           (e) => { showAnswer(JSON.parse(e.data)); });
  es.addEventListener("queued",   (e) => {
    sawAny = true;
    const p = JSON.parse(e.data).position;
    setBusy(true, `Queued behind ${p} run${p === 1 ? "" : "s"} — only a couple run at once, to stay polite to the site.`);
  });
  es.addEventListener("done",  (e) => { finish(); showDone(JSON.parse(e.data)); });
  es.addEventListener("error_event", (e) => { finish(); showError(JSON.parse(e.data)); });
  es.addEventListener("error", (e) => {
    // Fires both for a server-sent "error" event and for a transport drop.
    if (e.data) { finish(); showError(JSON.parse(e.data)); return; }
    if (es) { es.close(); es = null; }
    startPolling(taskId);                     // transport failed; keep going
  });
  setTimeout(() => { if (!sawAny) startPolling(taskId); }, 4000);
}

async function ensureSession() {
  if (sessionId) return sessionId;
  const r = await fetch("/api/sessions", { method:"POST" });
  sessionId = (await r.json()).session_id;
  return sessionId;
}

async function submit(task) {
  reset();
  setBusy(true, "Starting from the homepage…");
  const sid = await ensureSession();
  let r = await fetch("/api/tasks", {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ task, session_id: sid }),
  });
  if (r.status === 404) {
    // The session expired or the server restarted: start a fresh conversation
    // and say so, rather than silently losing the follow-up context.
    sessionId = null;
    const fresh = await ensureSession();
    setBusy(true, "Previous conversation expired — starting a new one.");
    r = await fetch("/api/tasks", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ task, session_id: fresh }),
    });
  }
  if (!r.ok) {
    const detail = await r.json().catch(() => ({}));
    showError({ kind:"internal", message: detail.detail || `Request failed (${r.status}).` });
    return;
  }
  const { task_id } = await r.json();
  setBusy(true, "Navigating — this usually takes 5–30 seconds.");
  stream(task_id);
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const task = $("task").value.trim();
  if (!task) return;
  $("task").value = "";
  // The box doubles as the follow-up box: the session id persists, so the next
  // request is another turn in the same conversation.
  $("task").placeholder = "Follow up — e.g. what about the second one?";
  submit(task);
});
</script>
