<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banque Misr Research Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------------------------------------------------------------------
     Banque Misr's own identity: the deep maroon from their site, a warm
     off-white ground, gold used only as an accent. The point is that this
     should look like it belongs next to the bank's website rather than like
     developer output.

     Sizes are set for a projector as much as for a laptop: nothing that
     carries meaning is below 13px, and the answer itself is set at 18px.
     --------------------------------------------------------------------- */
  :root {
    --maroon:#8A1538; --maroon-deep:#6B0F2B; --maroon-soft:#F5E9ED;
    --gold:#C08A19; --gold-line:#E7CE93; --gold-soft:#FBF3E2;

    --bg:#FAF6F3; --bg-sunk:#F3ECE7; --panel:#FFFFFF;
    --ink:#1A1618; --ink-2:#413A3D; --muted:#6B6165;
    --line:#E7DED9; --line-soft:#F1EAE5;

    --ok:#1B6E45; --ok-soft:#E4F1EA; --warn:#8A5D00; --warn-bg:#FBF1DC;
    --bad:#96201F; --bad-soft:#FBEAE8;

    /* Region badges on a hop: three quiet, distinguishable tints. */
    --nav:#ECE7F6; --nav-ink:#463B77;
    --body:#E4F0E9; --body-ink:#255C42;
    --footer:#FBE9E3; --footer-ink:#8A4324;

    /* The derived-statement surface. Deliberately NOT the warning colour:
       this is an extra layer of insight, not a caution. */
    --insight-bg:#F8F3F5; --insight-line:#EADDE2;

    --shadow-sm:0 1px 2px rgba(26,22,24,.05);
    --shadow:0 1px 2px rgba(26,22,24,.05), 0 8px 24px -8px rgba(26,22,24,.10);
    --shadow-lg:0 2px 4px rgba(26,22,24,.06), 0 18px 44px -14px rgba(26,22,24,.18);

    --r-lg:18px; --r-md:12px; --r-sm:8px;

    --fs-answer:18px; --fs-body:16px; --fs-sm:14.5px; --fs-xs:13px;
    --track:.08em;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:400 16.5px/1.62 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }

  /* --- masthead -------------------------------------------------------- */
  header.top {
    background:linear-gradient(160deg, var(--maroon) 0%, var(--maroon-deep) 100%);
    color:#fff; border-bottom:3px solid var(--gold);
    box-shadow:0 1px 0 rgba(0,0,0,.06);
  }
  .top-inner { max-width:920px; margin:0 auto; padding:22px 28px; display:flex;
               align-items:center; gap:16px; }
  .mark {
    width:42px; height:42px; border-radius:11px; flex:none;
    background:var(--gold); color:#40200A;
    display:grid; place-items:center; font-weight:700; font-size:15px;
    letter-spacing:.01em; box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);
  }
  .top h1 { font-size:20px; font-weight:650; margin:0; letter-spacing:-.015em; }
  .top .tag { font-size:14px; color:rgba(255,255,255,.78); margin-top:2px; }

  /* --- thread ---------------------------------------------------------- */
  .wrap { max-width:920px; margin:0 auto; padding:34px 28px 170px; }
  .turn { margin-bottom:44px; }
  .turn + .turn { border-top:1px solid var(--line); padding-top:38px; }
  .turn:last-child { margin-bottom:10px; }

  .ask { display:flex; justify-content:flex-end; margin-bottom:20px; }
  .ask .bubble {
    background:var(--maroon); color:#fff; padding:13px 20px;
    border-radius:18px 18px 5px 18px; max-width:76%;
    font-size:var(--fs-body); font-weight:500; line-height:1.5;
    box-shadow:var(--shadow); text-align:start;
  }

  .reply { display:flex; gap:14px; align-items:flex-start; }
  .avatar {
    width:34px; height:34px; border-radius:10px; flex:none; margin-top:2px;
    background:var(--maroon-soft); color:var(--maroon);
    display:grid; place-items:center; font-size:12.5px; font-weight:700;
    border:1px solid #EEDDE3;
  }
  .reply-body { flex:1; min-width:0; }

  .card {
    background:var(--panel); border:1px solid var(--line);
    border-radius:var(--r-lg); box-shadow:var(--shadow);
    padding:22px 26px; margin-bottom:16px;
  }
  .card.tight { padding:18px 22px; }
  h3.section {
    font-size:12px; text-transform:uppercase; letter-spacing:var(--track);
    color:var(--muted); margin:0 0 14px; font-weight:650;
  }

  /* --- composer -------------------------------------------------------- */
  .composer {
    position:fixed; left:0; right:0; bottom:0;
    background:linear-gradient(to top, var(--bg) 58%, rgba(250,246,243,.94) 80%, rgba(250,246,243,0));
    padding:36px 28px 24px;
  }
  .composer form {
    max-width:920px; margin:0 auto; display:flex; gap:10px; align-items:center;
    background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:8px 8px 8px 10px; box-shadow:var(--shadow-lg);
    transition:border-color .15s, box-shadow .15s;
  }
  input[type=text] {
    flex:1; border:0; background:transparent; color:var(--ink);
    font:inherit; font-size:var(--fs-body); padding:11px 8px;
    text-align:start; min-width:0;
  }
  input[type=text]:focus { outline:none; }
  input[type=text]::placeholder { color:var(--muted); }
  .composer form:focus-within {
    border-color:var(--maroon); box-shadow:var(--shadow-lg), 0 0 0 3px var(--maroon-soft);
  }
  button.send {
    border:0; border-radius:12px; cursor:pointer; padding:12px 24px;
    background:var(--maroon); color:#fff; font:650 15.5px/1 "Inter", sans-serif;
    transition:background .15s;
  }
  button.send:hover:not(:disabled) { background:var(--maroon-deep); }
  button.send:disabled { opacity:.42; cursor:default; }
  .status { max-width:920px; margin:12px auto 0; color:var(--muted);
            font-size:var(--fs-sm); display:flex; align-items:center; gap:9px; }
  .spin { width:8px; height:8px; border-radius:50%; background:var(--maroon);
          animation:p 1.1s ease-in-out infinite; flex:none; }
  @keyframes p { 0%,100%{opacity:.25} 50%{opacity:1} }

  /* --- interpreting ---------------------------------------------------- */
  .interpreting {
    background:var(--gold-soft); border:1px solid var(--gold-line);
    border-radius:var(--r-md); padding:14px 18px; margin-bottom:16px;
    font-size:var(--fs-sm); line-height:1.55;
  }
  .interpreting b { font-weight:650; color:var(--ink); }
  .replay-badge {
    display:inline-flex; align-items:center; gap:7px; font-size:var(--fs-xs);
    background:var(--maroon-soft); color:var(--maroon-deep);
    padding:6px 13px; border-radius:20px; margin-bottom:14px; font-weight:600;
    border:1px solid #EEDDE3;
  }

  /* --- plan: a stepper ------------------------------------------------- */
  .sg { display:flex; gap:14px; align-items:flex-start; padding:14px 0 14px; position:relative; }
  .sg:first-child { padding-top:2px; }
  .sg:last-child  { padding-bottom:2px; }
  /* The rail is drawn by the step itself so it connects to the next one,
     which is what makes this read as a sequence rather than a list. */
  .sg::before {
    content:""; position:absolute; inset-inline-start:12px; top:32px; bottom:-2px;
    width:2px; background:var(--line);
  }
  .sg:first-child::before { top:20px; }
  .sg:last-child::before  { display:none; }
  .sg .dot {
    width:26px; height:26px; border-radius:50%; flex:none; margin-top:0;
    display:grid; place-items:center; font-size:12.5px; font-weight:700;
    background:var(--panel); color:var(--muted); border:2px solid var(--line);
    position:relative; z-index:1; font-variant-numeric:tabular-nums;
  }
  .sg.resolved .dot { background:var(--ok); color:#fff; border-color:var(--ok); }
  .sg.partial  .dot { background:var(--warn-bg); color:var(--warn); border-color:#E3C685; }
  .sg.not_available .dot, .sg.unresolved .dot, .sg.unreadable .dot {
    background:var(--bad-soft); color:var(--bad); border-color:#EBC3BF; }
  .sg.running  .dot { background:var(--maroon); color:#fff; border-color:var(--maroon);
                      animation:p 1.1s ease-in-out infinite; }
  .sg .q { flex:1; text-align:start; font-size:var(--fs-body); line-height:1.5;
           padding-top:1px; }
  .sg.pending .q { color:var(--muted); }
  .sg.running .q { font-weight:600; }
  .sg .why2 { color:var(--muted); font-size:var(--fs-xs); margin-top:4px; line-height:1.5; }
  .plan-why { font-size:var(--fs-sm); color:var(--muted); margin:-4px 0 6px;
              text-align:start; line-height:1.55; }
  .plan-why b { color:var(--ink); font-weight:650; }
  .plan-why .stamp {
    display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.05em;
    text-transform:uppercase; color:var(--maroon-deep); background:var(--maroon-soft);
    border:1px solid #EEDDE3; border-radius:6px; padding:3px 8px;
    margin-inline-end:8px; vertical-align:2px;
  }
  .budget { margin-top:18px; padding-top:14px; border-top:1px solid var(--line-soft);
            font-size:var(--fs-xs); color:var(--muted); font-variant-numeric:tabular-nums;
            letter-spacing:.01em; }

  /* --- trail: a timeline ----------------------------------------------- */
  details.trail > summary {
    cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px;
    font-size:12px; text-transform:uppercase; letter-spacing:var(--track);
    color:var(--muted); font-weight:650;
  }
  details.trail > summary:hover { color:var(--ink); }
  details.trail > summary::-webkit-details-marker { display:none; }
  details.trail > summary::after {
    content:"›"; margin-inline-start:auto; font-size:20px; line-height:1;
    transition:transform .15s; text-transform:none; letter-spacing:0;
    color:var(--muted);
  }
  details.trail[open] > summary::after { transform:rotate(90deg); }
  details.trail[open] > summary { margin-bottom:18px; padding-bottom:14px;
                                  border-bottom:1px solid var(--line-soft); }
  .sgroup { margin-top:20px; padding-top:16px; border-top:1px solid var(--line-soft); }
  .sgroup:first-child { margin-top:0; padding-top:0; border-top:0; }
  .sgroup > .head { font-size:var(--fs-xs); color:var(--muted); margin-bottom:12px;
                    text-align:start; font-weight:600; letter-spacing:.01em; }

  .hop { display:grid; grid-template-columns:30px 1fr; gap:0 14px;
         padding:0 0 20px; position:relative; }
  .hop:last-child { padding-bottom:2px; }
  .rail { grid-row:1 / span 3; position:relative; }
  .rail i {
    position:absolute; inset-inline-start:0; top:1px;
    width:26px; height:26px; border-radius:50%;
    background:var(--maroon-soft); color:var(--maroon-deep);
    border:2px solid var(--panel); box-shadow:0 0 0 1.5px #E9D6DD;
    display:grid; place-items:center; font-size:12px; font-weight:700;
    font-variant-numeric:tabular-nums; font-style:normal;
  }
  .rail::before {
    content:""; position:absolute; inset-inline-start:12px; top:29px; bottom:-8px;
    width:2px; background:var(--line);
  }
  .hop:last-child .rail::before { display:none; }
  .hopline { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
             min-height:28px; }
  .label { font-weight:650; font-size:var(--fs-body); line-height:1.35; }
  .badge {
    font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700;
    padding:3px 9px; border-radius:20px;
  }
  .badge.nav{background:var(--nav);color:var(--nav-ink)}
  .badge.body{background:var(--body);color:var(--body-ink)}
  .badge.footer{background:var(--footer);color:var(--footer-ink)}
  /* The reasoning is the point of the whole screen: it is what shows the
     agent deciding rather than a script running. Given room accordingly. */
  .why { margin-top:7px; font-size:var(--fs-sm); color:var(--ink-2);
         text-align:start; line-height:1.55; }
  .meta { margin-top:9px; color:var(--muted); font-size:var(--fs-xs);
          font-variant-numeric:tabular-nums; word-break:break-all;
          display:flex; flex-wrap:wrap; gap:5px 8px; align-items:center; }
  .meta > span { display:inline-flex; align-items:center; }
  .meta > span + span::before {
    content:"·"; margin:0 8px 0 0; color:var(--line); font-weight:700;
  }
  .meta .url { color:var(--muted); }
  .conf { display:inline-flex; align-items:center; gap:6px; }
  .conf b { width:42px; height:4px; border-radius:2px; background:var(--line);
            display:inline-block; overflow:hidden; }
  .conf b i { display:block; height:100%; background:var(--maroon); }
  /* dir="auto" is per-string by definition: the browser picks direction from
     the first strong character, so one run can hold Arabic and English lines
     without flipping the page. URLs and badges stay explicitly ltr. */
  [dir=auto] { text-align:start; }
  .meta, .badge, ul.sources { direction:ltr; text-align:left; }

  .gate {
    margin:2px 0 20px 44px; padding:13px 16px; font-size:var(--fs-xs);
    background:var(--warn-bg); border:1px solid var(--gold-line);
    border-radius:var(--r-sm); line-height:1.55;
  }
  .gate b { color:var(--ink); }
  .expanded { font-size:var(--fs-xs); color:var(--muted); padding:4px 0 0 44px; }

  /* --- the answer card -------------------------------------------------- */
  /* The card is banded rather than padded: a header that names it, the
     answer at full size, and the evidence beneath on a sunk ground. */
  .answer-card { padding:0; overflow:hidden; border-top:3px solid var(--maroon); }
  .answer-card.none { border-top-color:var(--muted); }
  .answer-head {
    display:flex; align-items:center; gap:10px;
    padding:15px 26px; background:var(--bg-sunk);
    border-bottom:1px solid var(--line);
  }
  .answer-head .ttl {
    font-size:12px; text-transform:uppercase; letter-spacing:var(--track);
    font-weight:700; color:var(--maroon-deep);
  }
  .answer-card.none .answer-head .ttl { color:var(--muted); }
  .answer-main { padding:24px 26px 22px; }
  .answer { font-size:var(--fs-answer); line-height:1.62; text-align:start; }
  .answer p  { margin:0 0 12px; }
  .answer h4 { margin:22px 0 9px; font-size:12px; text-transform:uppercase;
               letter-spacing:var(--track); color:var(--maroon); font-weight:700; }
  .answer h4:first-child { margin-top:0; }
  .answer ul { margin:0 0 12px; padding-inline-start:22px; }
  .answer li { margin:5px 0; }
  .answer > *:last-child { margin-bottom:0; }

  /* Label/value lines rendered as rows. The text is exactly what the pipeline
     produced -- the colon is a column break, not an edit -- but twenty of them
     stacked as paragraphs read as a wall, and as rows they read as a schedule
     of fees, which is what they are. */
  .pairs { margin:2px 0 14px; border-top:1px solid var(--line-soft); }
  .pairs > .row {
    display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);
    gap:6px 20px; padding:11px 2px; border-bottom:1px solid var(--line-soft);
    font-size:var(--fs-body); line-height:1.5;
  }
  /* min-width:0 lets a grid column actually shrink, and anywhere-wrapping
     keeps an unbroken token (a URL, a template placeholder) inside the card
     instead of running off its edge. */
  .pairs > .row > .k, .pairs > .row > .v {
    min-width:0; overflow-wrap:anywhere; text-align:start;
  }
  .pairs > .row > .k { color:var(--ink-2); }
  .pairs > .row > .v { font-weight:650; font-variant-numeric:tabular-nums;
                       color:var(--ink); }

  /* Derived statements: an extra layer of insight, set apart from the facts
     and labelled in place. Deliberately not the warning palette -- the point
     is "here is what the agent worked out", not "be careful". */
  .derived {
    margin-top:22px; padding:16px 20px; border-radius:var(--r-md);
    background:var(--insight-bg); border:1px solid var(--insight-line);
    border-inline-start:4px solid var(--maroon);
  }
  .derived.judgment { border-inline-start-color:var(--gold); }
  .derived .kicker { margin-bottom:10px; text-align:start; }
  .derived .kicker .k-label {
    display:inline-block; font-size:11.5px; text-transform:uppercase;
    letter-spacing:.07em; font-weight:700; color:#fff; background:var(--maroon);
    border-radius:6px; padding:4px 10px;
  }
  .derived.judgment .kicker .k-label { background:var(--gold); }
  .derived .kicker .k-note {
    display:block; margin-top:7px; font-size:var(--fs-xs); color:var(--muted);
    line-height:1.5;
  }
  .derived .answer { font-size:var(--fs-body); }

  /* --- the evidence footer --------------------------------------------- */
  .answer-foot {
    padding:18px 26px 20px; background:var(--bg-sunk);
    border-top:1px solid var(--line);
  }
  .answer-foot > *:first-child { margin-top:0; }
  .support { display:flex; align-items:center; gap:12px; flex-wrap:wrap;
             font-size:var(--fs-sm); color:var(--ink-2);
             font-variant-numeric:tabular-nums; }
  .support .n { font-weight:650; color:var(--ink); }
  .bar { flex:1; min-width:90px; max-width:190px; height:8px; border-radius:5px;
         background:#E2DAD5; overflow:hidden; direction:ltr; }
  .bar > i { display:block; height:100%; background:var(--ok); border-radius:5px; }
  .bar.warn > i { background:var(--warn); }
  .bar.bad  > i { background:var(--bad); }
  .caveat { margin-top:9px; font-size:var(--fs-xs); color:var(--muted); line-height:1.55; }
  .caveat b { color:var(--ink); font-weight:650; }

  details.struck { margin-top:11px; font-size:var(--fs-xs); }
  details.struck > summary { cursor:pointer; color:var(--muted); }
  details.struck > summary:hover { color:var(--ink); }
  details.struck ul { margin:11px 0 0; padding-inline-start:20px; }
  details.struck li { margin:9px 0; }
  .struck-text { display:block; text-decoration:line-through; opacity:.7; }
  .struck-why  { display:block; color:var(--muted); font-size:12.5px; margin-top:2px; }

  ul.sources, ul.gaps { margin:0; padding-inline-start:22px; font-size:var(--fs-sm);
                        line-height:1.6; }
  ul.sources { word-break:break-all; }
  ul.sources li { margin:7px 0; }
  ul.sources a { color:var(--maroon); text-decoration-color:#D9B9C4;
                 text-underline-offset:2px; }
  ul.sources a:hover { color:var(--maroon-deep); }
  ul.gaps { color:var(--ink-2); }
  ul.gaps li { margin:7px 0; }
  .verdict-bad { border-inline-start:4px solid var(--bad); }
  .verdict-bad h4 { margin:0 0 8px; font-size:var(--fs-answer); font-weight:650; }
  .verdict-bad p { margin:0; font-size:var(--fs-body); }

  @media (max-width:680px) {
    :root { --fs-answer:17px; --fs-body:15.5px; --fs-sm:14px; --fs-xs:12.5px; }
    body { font-size:16px; }
    .wrap { padding:24px 16px 160px; }
    .top-inner { padding:18px 16px; gap:12px; }
    .mark { width:38px; height:38px; }
    .top h1 { font-size:18px; }
    .top .tag { font-size:13px; }
    .composer { padding:16px 14px 18px; }
    .ask .bubble { max-width:88%; }
    .reply { gap:10px; }
    .avatar { width:28px; height:28px; font-size:11px; }
    .card { padding:18px 18px; border-radius:var(--r-md); }
    .answer-head, .answer-main, .answer-foot { padding-left:18px; padding-right:18px; }
    .hop { grid-template-columns:26px 1fr; gap:0 10px; }
    .rail i { width:23px; height:23px; font-size:11px; }
    .rail::before { inset-inline-start:10.5px; }
    .gate, .expanded { margin-inline-start:36px; padding-inline-start:36px; }
    .gate { margin-inline-start:0; padding:12px 14px; }
    .expanded { padding-inline-start:36px; }
    /* One column: a 1.35fr/1fr split leaves no room for either half here. */
    .pairs > .row { grid-template-columns:1fr; gap:2px; padding:10px 2px; }
    .pairs > .row > .k { font-size:var(--fs-sm); }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --maroon:#C9556F; --maroon-deep:#B03C58; --maroon-soft:#38181F;
      --gold:#D9B24A; --gold-line:#5A4A20; --gold-soft:#2B2415;

      --bg:#141012; --bg-sunk:#191416; --panel:#1D1719;
      --ink:#F0EAEB; --ink-2:#CFC5C8; --muted:#9C9296;
      --line:#2E2528; --line-soft:#261F22;

      --ok:#5FC98D; --ok-soft:#16301F; --warn:#DFB157; --warn-bg:#2A2315;
      --bad:#F0908E; --bad-soft:#331B1B;

      --nav:#282152; --nav-ink:#BFB4F0; --body:#153025; --body-ink:#89D7B0;
      --footer:#37211C; --footer-ink:#EDA684;

      --insight-bg:#221A1D; --insight-line:#38292E;

      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px -8px rgba(0,0,0,.5);
      --shadow-lg:0 2px 4px rgba(0,0,0,.4), 0 18px 44px -14px rgba(0,0,0,.6);
    }
    header.top { background:linear-gradient(160deg, #4A1223 0%, #300B17 100%); }
    .mark { color:#2A1405; }
    .composer { background:linear-gradient(to top, var(--bg) 58%, rgba(20,16,18,.94) 80%, rgba(20,16,18,0)); }
    .ask .bubble { background:var(--maroon-deep); color:#fff; }
    .avatar { border-color:#3A252C; }
    .replay-badge { border-color:#3A252C; }
    .bar { background:#33292D; }
    .rail i { box-shadow:0 0 0 1.5px #3A252C; }
    .derived .kicker .k-label { color:#22181B; }
    .plan-why .stamp { border-color:#3A252C; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="mark">BM</div>
    <div>
      <h1>Banque Misr Research Assistant</h1>
      <div class="tag">Navigates the live site from the homepage — every step is the agent's own choice.</div>
    </div>
  </div>
</header>

<div class="wrap"><div id="thread"></div></div>

<div class="composer">
  <form id="form">
    <input id="task" type="text" autocomplete="off" dir="auto"
           placeholder="Ask about a product, a fee, or a rate…" required>
    <button id="go" class="send" type="submit">Ask</button>
  </form>
  <div id="status" class="status" hidden></div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let sessionId = null, es = null, pollTimer = null;

// Per-turn state. A turn is one question and everything the agent did for it;
// the thread holds several, so nothing here can be a single global.
let turn = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

// Internal identifiers that have reached a saved answer. The composer no
// longer shows the model any of these — a fact's label is humanised before it
// goes into the prompt — but an answer recorded before that fix has the raw
// identifier baked into its text, and a recording is replayed verbatim. So
// they are also repaired at render time.
//
// Narrow on purpose: only a snake_case token at the start of a line, directly
// before a dash or colon. Nothing a bank would legitimately write looks like
// that, and anchoring to line start keeps it away from prose.
const INTERNAL_LABELS = { entity_list: "Products listed on this page" };
const IDENTIFIER_LABEL = /^(\s*(?:[-*]\s+)?)([a-z][a-z0-9]*(?:_[a-z0-9]+)+)(\s*(?:—|–|-|:)\s*)/gm;

function humaniseLabels(text) {
  return String(text || "").replace(IDENTIFIER_LABEL, (_m, lead, id, sep) => {
    const words = INTERNAL_LABELS[id] || id.replace(/_/g, " ");
    return lead + words.charAt(0).toUpperCase() + words.slice(1) + sep;
  });
}

// Presentation only: a "Label: value" line becomes a two-column row. Not a
// single character is added, removed or reordered — the colon that was already
// in the text is used as the column break. Twenty fee lines stacked as
// paragraphs read as a wall; as rows they read as the schedule of fees they
// are. The label half is capped short and must not look like a sentence, so
// prose that happens to contain a colon stays prose.
const PAIR = /^([^:]{2,100}):\s+(\S.*)$/;
function asPair(line) {
  const m = line.match(PAIR);
  if (!m) return null;
  const key = m[1];
  // A label is a name, not a clause: no sentence punctuation, and not a
  // bullet or heading (those are handled before this is ever reached). The
  // terminator has to be followed by a space or end the label -- otherwise
  // "Cash withdrawals through BM ATMs and P.O.S and other banks" is thrown
  // out over an abbreviation.
  if (/[.!?;](\s|$)|^\s*[-*#]/.test(key)) return null;
  // `raw` is kept so the fallback below can put the line back byte for byte.
  return { k: key.trim(), v: m[2].trim(), raw: line };
}

// A deliberately tiny markdown renderer: bold, headings, bullets, paragraphs.
// The composer is asked for grouped output with short bold headings, and this
// is what makes that structure visible instead of a run-on paragraph.
// Everything is escaped first, so only the patterns below can produce markup —
// model output is never inserted as HTML.
function md(text) {
  // Blocks are joined back into one line stream first, so a run of pair lines
  // is still a run when the composer separated each with a blank line.
  const lines = esc(humaniseLabels(text)).split(/\n+/).filter((l) => l.trim());
  const out = []; let list = [], pairs = [];
  const flushList  = () => { if (list.length)  { out.push(`<ul>${list.join("")}</ul>`); list = []; } };
  // One lone pair is just a sentence with a colon in it; two or more in a row
  // are a table. Below the threshold they go back to being paragraphs.
  const flushPairs = () => {
    if (pairs.length >= 2) {
      out.push(`<div class="pairs">${pairs.map((p) =>
        `<div class="row"><span class="k">${inline(p.k)}</span>` +
        `<span class="v">${inline(p.v)}</span></div>`).join("")}</div>`);
    } else {
      pairs.forEach((p) => out.push(`<p>${inline(p.raw)}</p>`));
    }
    pairs = [];
  };
  const flush = () => { flushList(); flushPairs(); };
  for (const line of lines) {
    const heading = line.match(/^\s*(#{1,6})\s+(.*)$/);
    const bold    = line.match(/^\s*\*\*(.+?)\*\*\s*:?\s*$/);
    const bullet  = line.match(/^\s*[-*]\s+(.*)$/);
    const pair    = (heading || bold || bullet) ? null : asPair(line);
    if (heading)     { flush(); out.push(`<h4>${inline(heading[2])}</h4>`); }
    else if (bold)   { flush(); out.push(`<h4>${inline(bold[1])}</h4>`); }
    else if (bullet) { flushPairs(); list.push(`<li>${inline(bullet[1])}</li>`); }
    else if (pair)   { flushList(); pairs.push(pair); }
    else             { flush(); out.push(`<p>${inline(line)}</p>`); }
  }
  flush();
  return out.join("");
}
const inline = (s) => s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

const SG_MARK = { pending:"", running:"", resolved:"✓", partial:"~",
                  not_available:"✕", unresolved:"✕", unreadable:"✕" };
const SG_WORD = { pending:"queued", running:"navigating…", resolved:"answered",
                  partial:"partly answered", not_available:"not found",
                  unresolved:"not found", unreadable:"document unreadable" };

// Every terminal status gets its own voice. "arrived" is deliberately not
// styled or worded as success: nothing has verified the page's content, and
// presenting it as an answer would be the single most misleading thing the UI
// could do.
const VERDICTS = {
  arrived:       { title:"Reached what looks like the destination",
                   caveat:"Content not yet verified — the agent judged the route, not the page." },
  no_candidates: { title:"Couldn't find it",
                   caveat:"Nothing on the pages reached led toward this request." },
  exhausted:     { title:"Couldn't find it",
                   caveat:"The agent ran out of budget before reaching an answer." },
  blocked:       { title:"The site blocked the request",
                   caveat:"An access-denied page was returned. The run stopped rather than risk a ban." },
  error:         { title:"The run failed", caveat:"" },
};

function setBusy(busy, note) {
  $("go").disabled = busy;
  $("status").hidden = !note;
  $("status").innerHTML = busy && note
    ? `<span class="spin"></span><span>${esc(note)}</span>` : esc(note || "");
}

/* --- one turn in the thread ------------------------------------------- */
function newTurn(task) {
  const el = document.createElement("div");
  el.className = "turn";
  el.innerHTML =
    `<div class="ask"><div class="bubble" dir="auto">${esc(task)}</div></div>` +
    `<div class="reply"><div class="avatar">BM</div><div class="reply-body">` +
      `<div class="t-badge"></div>` +
      `<div class="t-interpreting"></div>` +
      `<div class="t-plan card" hidden><h3 class="section">Plan</h3>` +
        `<div class="t-plan-why"></div>` +
        `<div class="t-sgs"></div><div class="t-budget budget"></div></div>` +
      `<details class="t-trail card trail" open><summary>How it got there</summary>` +
        `<div class="t-hops"></div></details>` +
      `<div class="t-final"></div>` +
    `</div></div>`;
  $("thread").appendChild(el);
  turn = {
    el,
    badge: el.querySelector(".t-badge"),
    interpreting: el.querySelector(".t-interpreting"),
    planCard: el.querySelector(".t-plan"),
    planWhy: el.querySelector(".t-plan-why"),
    sgs: el.querySelector(".t-sgs"),
    budget: el.querySelector(".t-budget"),
    trail: el.querySelector(".t-trail"),
    hops: el.querySelector(".t-hops"),
    final: el.querySelector(".t-final"),
    seenHops: {}, plan: { order: [], byId: {} },
    gateShown: new Set(), pendingGates: {}, answered: false,
  };
  el.scrollIntoView({ behavior: "smooth", block: "start" });
  return turn;
}

function showReplayBadge(d) {
  // A recording must never be passed off as a live run.
  if (!d.replayed || !turn) return;
  turn.badge.innerHTML =
    `<span class="replay-badge">Replay — a saved run, not a live one</span>`;
}

function showResolved(d) {
  if (!turn) return;
  showReplayBadge(d);
  // Keyed on the observable fact that the text changed, not only on the
  // model's used_context self-report: a model can rewrite a follow-up
  // correctly and still claim it used no context, and that would have hidden
  // the one piece of visible evidence that conversation memory works.
  const rewritten = d.sub_goal && d.sub_goal !== d.task;
  if (!rewritten && !d.used_context) return;
  turn.interpreting.innerHTML =
    `<div class="interpreting">` +
    (rewritten
      ? `<b>Interpreting as:</b> <span dir="auto">${esc(d.sub_goal)}</span>`
      : `<b>Read in the context of this conversation.</b>`) +
    `<div class="caveat" dir="auto">${esc(d.reasoning)}</div></div>`;
}

/* --- plan -------------------------------------------------------------- */
function renderPlan() {
  if (!turn || !turn.plan.order.length) return;
  turn.planCard.hidden = false;
  turn.sgs.innerHTML = turn.plan.order.map((id, i) => {
    const sg = turn.plan.byId[id], state = sg.status || "pending";
    // While a sub-goal is still queued its own rationale is the useful line;
    // once it has run, what happened to it is.
    const note = sg.reason || (state === "pending" && sg.why) || SG_WORD[state] || "";
    // The step number stands in until there is an outcome mark, so the panel
    // reads as an ordered plan from the moment it appears.
    const mark = SG_MARK[state] || String(i + 1);
    return `<div class="sg ${esc(state)}">` +
      `<span class="dot">${mark}</span>` +
      `<span class="q"><span dir="auto">${esc(sg.question)}</span>` +
      `<div class="why2" dir="auto">${esc(note)}</div></span></div>`;
  }).join("");
}

function showPlan(d) {
  if (!turn) return;
  turn.plan = { order: [], byId: {} };
  (d.sub_goals || []).forEach((sg) => {
    turn.plan.order.push(sg.id);
    turn.plan.byId[sg.id] = { question: sg.question, status: sg.status || "pending",
                              reason: "", why: sg.why || "" };
  });
  // Say which planner wrote this. A keyword match presented as agentic
  // planning would be the same kind of overclaim as a green bar over zero
  // claims, so the label is not optional.
  turn.planWhy.innerHTML = d.plan_source === "model"
    ? `<div class="plan-why"><span class="stamp">Decomposed by the model</span>` +
      (d.plan_reasoning ? `<span dir="auto">${esc(d.plan_reasoning)}</span>` : "") + `</div>`
    : `<div class="plan-why"><span class="stamp">Decomposed by keyword rules</span></div>`;
  renderPlan(); showBudget(d);
}

function showBudget(d) {
  if (!turn || d.pages_max === undefined || d.pages_max === null) return;
  turn.budget.textContent =
    `${d.pages_used}/${d.pages_max} pages · ${d.llm_calls_used}/${d.llm_calls_max} model calls`;
}

function subGoalStarted(d) {
  if (!turn) return;
  if (!turn.plan.byId[d.sub_goal_id]) {
    turn.plan.order.push(d.sub_goal_id);
    turn.plan.byId[d.sub_goal_id] = { question: d.question, status: "pending", reason: "" };
  }
  Object.assign(turn.plan.byId[d.sub_goal_id], { status: "running", reason: "" });
  renderPlan();
}

function subGoalFinished(d) {
  if (!turn) return;
  if (!turn.plan.byId[d.sub_goal_id]) {
    turn.plan.order.push(d.sub_goal_id);
    turn.plan.byId[d.sub_goal_id] = {};
  }
  Object.assign(turn.plan.byId[d.sub_goal_id],
                { question: d.question, status: d.status, reason: d.reason });
  renderPlan(); showBudget(d);
}

function planExpanded(d) {
  if (!turn) return;
  (d.added || []).forEach((sg) => {
    if (turn.plan.byId[sg.id]) return;
    turn.plan.order.push(sg.id);
    turn.plan.byId[sg.id] = { question: sg.question, status: "pending",
                              reason: "added from what was found" };
  });
  renderPlan();
  const note = document.createElement("div");
  note.className = "expanded";
  note.textContent = `plan expanded: +${(d.added || []).length} sub-goal(s) from what the page listed`;
  turn.hops.appendChild(note);
}

/* --- gate -------------------------------------------------------------- */
// Rendered rather than only logged: the validator said stop and the run kept
// going, which is a decision the screen has to own up to.
function showGate(d) {
  if (!turn || d.accepted) return;
  const key = `${d.sub_goal_id}|${d.url}`;
  if (turn.gateShown.has(key)) return;
  turn.gateShown.add(key);
  const el = document.createElement("div");
  el.className = "gate";
  el.innerHTML =
    `<b>Kept looking.</b> The validator accepted this page, but its evidence also ` +
    `appears on ${d.pages_compared} other page(s) fetched in this run, so it is site ` +
    `navigation rather than an answer.` +
    `<div class="caveat" dir="auto">validator said: ${esc(d.validator_reason)}</div>`;
  // The gate runs during validation, before the step is logged, so on a live
  // stream the notice arrives before the hop it belongs to. Held until then.
  const hop = turn.hops.querySelector(`.hop[data-url="${CSS.escape(d.url)}"]`);
  if (hop) hop.insertAdjacentElement("afterend", el);
  else (turn.pendingGates[d.url] ||= []).push(el);
}

function flushGates(url) {
  if (!turn) return;
  const waiting = turn.pendingGates[url];
  if (!waiting) return;
  delete turn.pendingGates[url];
  const hop = turn.hops.querySelector(`.hop[data-url="${CSS.escape(url)}"]`);
  waiting.forEach((el) => (hop ? hop.insertAdjacentElement("afterend", el)
                               : turn.hops.appendChild(el)));
}

/* --- hops -------------------------------------------------------------- */
function hopGroup(d) {
  const id = "sg-" + (d.sub_goal_id || "_");
  let group = turn.el.querySelector(`[data-group="${id}"]`);
  if (!group) {
    group = document.createElement("div");
    group.className = "sgroup";
    group.dataset.group = id;
    if (turn.plan.order.length > 1) {
      group.innerHTML = `<div class="head" dir="auto">for: ${esc(d.sub_goal || "")}</div>`;
    }
    turn.hops.appendChild(group);
  }
  return group;
}

function addHop(d) {
  if (!turn) return;
  const key = d.sub_goal_id || "_";
  if (d.hop < (turn.seenHops[key] || 0)) return;   // poll fallback may resend
  turn.seenHops[key] = d.hop + 1;
  const badge = d.source ? `<span class="badge ${esc(d.source)}">${esc(d.source)}</span>` : "";
  const label = d.hop === 0 ? "Starting page" : esc(d.label || "(unlabelled link)");
  const conf = d.hop > 0
    ? `<span class="conf">confidence <b><i style="width:${Math.round(Number(d.confidence) * 100)}%"></i></b>` +
      `${Number(d.confidence).toFixed(2)}</span>` : "";
  const el = document.createElement("div");
  el.className = "hop";
  el.dataset.url = d.url;                    // so a gate notice can find its page
  el.innerHTML =
    `<div class="rail"><i>${d.hop}</i></div><div>` +
      `<div class="hopline">` +
      `<span class="label" dir="auto">${label}</span>${badge}</div>` +
      `<div class="why" dir="auto">${esc(d.reasoning)}</div>` +
      `<div class="meta"><span class="url">${esc(d.url)}</span><span>${d.status}</span>` +
      `<span>${d.links_found} links</span>` +
      (d.hop > 0 ? `<span>${d.candidates_offered}/${d.candidates_available} candidates</span>${conf}` : "") +
    `</div></div>`;
  hopGroup(d).appendChild(el);
  flushGates(d.url);
}

/* --- the answer -------------------------------------------------------- */
// Three kinds of sentence, three different warranties. A derived conclusion
// must never wear a verified fact's badge, so the distinction is written into
// the block rather than carried by colour alone — colour fails in a screenshot
// and for a colour-blind reader, and a legend elsewhere on the page is a
// legend nobody reads.
// Same words as before, split at the dash so the label can be a chip and the
// qualification can sit under it. Neither half is optional: the label alone
// would not say what warranty it carries.
const TIER_KICKER = {
  analysis: { label: "The agent's reading",
              note:  "worked out from the facts above, not stated on any page" },
  judgment: { label: "Recommendation",
              note:  "the agent's opinion, not the bank's" },
};

function answerBody(d) {
  const tiers = (d.composition && d.composition.tiers) || null;
  if (!tiers || !tiers.fact) return `<div class="answer" dir="auto">${md(d.answer || "")}</div>`;

  let html = `<div class="answer" dir="auto">${md((tiers.fact || []).join("\n"))}</div>`;
  for (const tier of ["analysis", "judgment"]) {
    const lines = tiers[tier];
    if (!lines || !lines.length) continue;
    const k = TIER_KICKER[tier];
    html +=
      `<div class="derived ${tier}">` +
        `<div class="kicker"><span class="k-label">${esc(k.label)}</span>` +
        `<span class="k-note">${esc(k.note)}</span></div>` +
        `<div class="answer" dir="auto">${md(lines.join("\n"))}</div>` +
      `</div>`;
  }
  return html;
}

function showAnswer(d) {
  if (!turn) return;
  turn.answered = true;
  // Progressive disclosure: the trail is the good part of the demo while the
  // run is going, and secondary once there is an answer to read.
  turn.trail.open = false;

  const gaps = (d.not_found || []).map((g) => `<li dir="auto">${esc(g)}</li>`).join("");
  const sources = (d.source_urls || []).map(
    (u) => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></li>`).join("");

  // What the bar means depends on how the answer was produced, so the label
  // changes with it rather than implying one warranty for both.
  //
  // support_rate is 1.0 when nothing was claimed, which would read as "fully
  // supported". With no claims there is nothing to be supported, so the bar is
  // replaced by a plain statement rather than a reassuring green line.
  const composed = d.answer_source === "composed";
  const g = (d.composition && d.composition.grounding) || null;
  let support;
  if (!d.claims_total) {
    support = `<div class="support">No verifiable claims were extracted, so there is ` +
              `nothing to attribute.</div>`;
  } else {
    const pct = Math.round((d.support_rate || 0) * 100);
    const cls = pct === 100 ? "" : (pct >= 50 ? "warn" : "bad");
    support =
      `<div class="support"><span>Facts whose value was found on the page they cite</span>` +
      `<span class="bar ${cls}"><i style="width:${pct}%"></i></span>` +
      `<span class="n">${d.claims_supported}/${d.claims_total} (${pct}%)</span></div>` +
      // Says what the bar covers. Figures are checked in all three tiers; the
      // inference in a derived sentence is never checked, and the bar must not
      // be read as vouching for it.
      (composed && d.composition && d.composition.tiered
        ? `<div class="caveat">Every figure is checked in all three tiers. The ` +
          `reasoning in a derived statement is the agent's and is not verified.</div>` : "") +
      (pct < 100 ? `<div class="caveat">Unsupported statements were removed from the answer ` +
                   `above rather than shown with sources beneath them.</div>` : "");
  }

  // How the wording was produced. A template answer is assembled from the
  // extracted values and cannot say anything they do not; a composed one was
  // written by the model and had every sentence checked against those values.
  let provenance = "";
  if (composed && g) {
    // The reasons used to be dumped inline, repeated verbatim, one per struck
    // sentence — unreadable, and it buried the answer. Count first, detail
    // one click away.
    let detail = "";
    if (g.sentences_struck) {
      const rows = (g.struck || []).map((s) =>
        `<li><span class="struck-text" dir="auto">${esc(s.sentence)}</span>` +
        `<span class="struck-why">${esc(s.reason.replace(/\.$/, ""))}</span></li>`).join("");
      detail = `<details class="struck"><summary>${g.sentences_struck} of ${g.sentences_total} ` +
        `sentence${g.sentences_total === 1 ? "" : "s"} removed — show what was cut</summary>` +
        `<ul>${rows}</ul></details>`;
    }
    provenance = `<div class="caveat"><b>Written by the model</b> from ` +
      `${d.composition.claims_offered} verified facts; every figure checked against them` +
      (g.sentences_struck ? "." : `, all ${g.sentences_total} kept.`) + `</div>` + detail;
  } else if (d.composition && d.composition.attempted && !d.composition.used) {
    provenance = `<div class="caveat"><b>Showing the extracted values.</b> A written answer ` +
      `was attempted and discarded: ${esc(d.composition.reason)}.</div>`;
  } else if (d.claims_total) {
    provenance = `<div class="caveat"><b>Showing the extracted values</b> exactly as they ` +
      `appear on the page — no wording was generated.</div>`;
  }

  // Three bands: what was found, then how it was made and how well it is
  // backed. Same information as before, in the order a reader needs it —
  // the answer first at full size, the warranty underneath and quieter.
  const evidence =
    support + provenance +
    (d.budget_exhausted ? `<div class="caveat">Stopped early: ${esc(d.budget_exhausted)}.</div>` : "") +
    (d.gate_rejections ? `<div class="caveat">${d.gate_rejections} page(s) were accepted by ` +
      `the validator and rejected here as site navigation.</div>` : "");

  turn.final.innerHTML =
    `<div class="card answer-card${d.resolved_count ? "" : " none"}">` +
      `<div class="answer-head"><span class="ttl">Answer</span></div>` +
      `<div class="answer-main">${answerBody(d)}</div>` +
      `<div class="answer-foot">${evidence}</div>` +
    `</div>` +
    (sources ? `<div class="card tight"><h3 class="section">Sources cited</h3>` +
               `<ul class="sources">${sources}</ul></div>` : "") +
    (gaps ? `<div class="card tight"><h3 class="section">Not found</h3>` +
            `<ul class="gaps">${gaps}</ul></div>` : "");
  setBusy(false, "");
}

function showDone(d) {
  // The loop's answer is the result whenever there is one; the older
  // page-reached verdict is kept for a bare navigation with no plan behind it
  // (recordings from before the intelligence layer landed, navigator tests).
  if (d.answer) { showAnswer(d.answer); return; }
  if (!turn || turn.answered) return;
  const v = VERDICTS[d.status] || VERDICTS.error;
  turn.trail.open = false;
  turn.final.innerHTML =
    `<div class="card verdict-bad"><h4>${esc(v.title)}</h4>` +
    `<p dir="auto">${esc(d.final_reasoning || "")}</p>` +
    (v.caveat ? `<div class="caveat">${esc(v.caveat)}</div>` : "") + `</div>`;
  setBusy(false, "");
}

function showError(d) {
  const v = VERDICTS[d.kind === "blocked" ? "blocked" : "error"];
  const html = `<div class="card verdict-bad"><h4>${esc(v.title)}</h4>` +
               `<p>${esc(d.message)}</p></div>`;
  if (turn) { turn.trail.open = false; turn.final.innerHTML = html; }
  else { $("thread").insertAdjacentHTML("beforeend", html); }
  setBusy(false, "");
}

function finish() {
  if (es) { es.close(); es = null; }
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

// Poll fallback: used when EventSource never connects or drops mid-run. The
// status endpoint accumulates everything the stream emitted, so replaying it
// is safe — addHop and showGate ignore what is already on screen.
function startPolling(taskId) {
  if (pollTimer) return;
  setBusy(true, "Live updates unavailable — polling for progress…");
  pollTimer = setInterval(async () => {
    let r;
    try { r = await fetch(`/api/tasks/${taskId}`); } catch { return; }
    if (r.status === 404) {
      finish();
      showError({ kind:"internal", message:"This run was lost — the server restarted." });
      return;
    }
    const s = await r.json();
    if (s.sub_goal) showResolved({ ...s, task: s.task });
    if (s.plan) showPlan(s.plan);
    (s.sub_goals || []).forEach(subGoalFinished);
    (s.gate_events || []).forEach(showGate);
    (s.hops || []).forEach(addHop);
    if (s.answer) showAnswer(s.answer);
    if (s.state === "done" && s.result) { finish(); showDone(s.result); }
    if (s.state === "error" && s.error) { finish(); showError(s.error); }
  }, 1000);
}

function stream(taskId) {
  let sawAny = false;
  es = new EventSource(`/api/tasks/${taskId}/stream`);
  const on = (name, fn) => es.addEventListener(name, (e) => { sawAny = true; fn(JSON.parse(e.data)); });
  on("resolved", showResolved);
  on("hop", addHop);
  on("plan", showPlan);
  on("sub_goal_started", subGoalStarted);
  on("sub_goal_finished", subGoalFinished);
  on("plan_expanded", planExpanded);
  on("gate", showGate);
  on("budget", showBudget);
  on("answer", showAnswer);
  on("synthesis_started", () =>
    setBusy(true, "Checking every claim against the pages this run actually fetched…"));
  on("queued", (d) => setBusy(true,
    `Queued behind ${d.position} run${d.position === 1 ? "" : "s"} — only a couple run at once, to stay polite to the site.`));
  es.addEventListener("done", (e) => { finish(); showDone(JSON.parse(e.data)); });
  es.addEventListener("error_event", (e) => { finish(); showError(JSON.parse(e.data)); });
  es.addEventListener("error", (e) => {
    // Fires both for a server-sent "error" event and for a transport drop.
    if (e.data) { finish(); showError(JSON.parse(e.data)); return; }
    if (es) { es.close(); es = null; }
    startPolling(taskId);                     // transport failed; keep going
  });
  setTimeout(() => { if (!sawAny) startPolling(taskId); }, 4000);
}

async function ensureSession() {
  if (sessionId) return sessionId;
  const r = await fetch("/api/sessions", { method:"POST" });
  sessionId = (await r.json()).session_id;
  return sessionId;
}

async function submit(task) {
  finish();
  newTurn(task);
  setBusy(true, "Starting from the homepage…");
  const sid = await ensureSession();
  let r = await fetch("/api/tasks", {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ task, session_id: sid }),
  });
  if (r.status === 404) {
    // The session expired or the server restarted: start a fresh conversation
    // and say so, rather than silently losing the follow-up context.
    sessionId = null;
    const fresh = await ensureSession();
    setBusy(true, "Previous conversation expired — starting a new one.");
    r = await fetch("/api/tasks", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ task, session_id: fresh }),
    });
  }
  if (!r.ok) {
    const detail = await r.json().catch(() => ({}));
    showError({ kind:"internal", message: detail.detail || `Request failed (${r.status}).` });
    return;
  }
  const { task_id } = await r.json();
  setBusy(true, "Navigating — this usually takes 5–30 seconds.");
  stream(task_id);
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const task = $("task").value.trim();
  if (!task) return;
  $("task").value = "";
  // The box doubles as the follow-up box: the session id persists, so the next
  // request is another turn in the same conversation.
  $("task").placeholder = "Follow up — e.g. what about the second one?";
  submit(task);
});
</script>
